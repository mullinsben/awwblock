<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="300" rx="18" fill="#FFFFFF"/>

  <!-- ===== Panel 1: Download ===== -->
  <g transform="translate(24,24)">
    <rect width="280" height="252" rx="14" fill="#F4F8FB" stroke="#E2EAF0"/>
    <circle cx="30" cy="34" r="15" fill="#2C6488"/>
    <text x="30" y="40" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">1</text>
    <text x="56" y="40" fill="#22303A" font-size="17" font-weight="700">Download the ZIP</text>
    <!-- green Code button -->
    <rect x="40" y="80" width="120" height="40" rx="8" fill="#2DA44E"/>
    <text x="100" y="105" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">&#60; &#62; Code  &#9662;</text>
    <text x="40" y="150" fill="#5A6B76" font-size="13">then  &#8595;  Download ZIP</text>
    <!-- folder -->
    <g transform="translate(96,170)">
      <path d="M4 14 h24 l6 8 h46 a6 6 0 0 1 6 6 v34 a6 6 0 0 1 -6 6 h-76 a6 6 0 0 1 -6 -6 v-46 a6 6 0 0 1 6 -6 z" fill="#F2C14E" stroke="#D9A23A"/>
      <text x="44" y="52" text-anchor="middle" fill="#7A5A1E" font-size="11" font-weight="700">awwblock</text>
    </g>
  </g>

  <!-- ===== Panel 2: chrome://extensions ===== -->
  <g transform="translate(340,24)">
    <rect width="280" height="252" rx="14" fill="#F4F8FB" stroke="#E2EAF0"/>
    <circle cx="30" cy="34" r="15" fill="#2C6488"/>
    <text x="30" y="40" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2</text>
    <text x="56" y="40" fill="#22303A" font-size="17" font-weight="700">Add it to your browser</text>
    <!-- mock browser bar -->
    <rect x="24" y="68" width="232" height="120" rx="10" fill="#fff" stroke="#D7E0E8"/>
    <rect x="36" y="80" width="208" height="20" rx="10" fill="#EAF0F4"/>
    <text x="48" y="94" fill="#5A6B76" font-size="11">chrome://extensions</text>
    <!-- Load unpacked button (highlighted) -->
    <rect x="36" y="112" width="104" height="30" rx="7" fill="#fff" stroke="#2C6488" stroke-width="2"/>
    <text x="88" y="131" text-anchor="middle" fill="#2C6488" font-size="12" font-weight="700">Load unpacked</text>
    <!-- Developer mode toggle (highlighted, ON) -->
    <text x="150" y="131" fill="#5A6B76" font-size="11">Dev mode</text>
    <rect x="208" y="118" width="34" height="19" rx="10" fill="#2C6488" stroke="#1F4C6B" stroke-width="2"/>
    <circle cx="233" cy="127.5" r="7" fill="#fff"/>
    <text x="140" y="172" text-anchor="middle" fill="#5A6B76" font-size="12.5">Developer mode ON, then</text>
    <text x="140" y="190" text-anchor="middle" fill="#5A6B76" font-size="12.5">Load unpacked &#8594; pick the folder</text>
  </g>

  <!-- ===== Panel 3: Done ===== -->
  <g transform="translate(656,24)">
    <rect width="280" height="252" rx="14" fill="#F4F8FB" stroke="#E2EAF0"/>
    <circle cx="30" cy="34" r="15" fill="#2C6488"/>
    <text x="30" y="40" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3</text>
    <text x="56" y="40" fill="#22303A" font-size="17" font-weight="700">Refresh any site</text>
    <!-- mini page with a duck where the ad was -->
    <rect x="40" y="76" width="200" height="120" rx="10" fill="#fff" stroke="#D7E0E8"/>
    <rect x="52" y="88" width="84" height="9" rx="4" fill="#E5EBEF"/>
    <rect x="52" y="104" width="120" height="7" rx="3" fill="#EDF1F4"/>
    <rect x="52" y="116" width="110" height="7" rx="3" fill="#EDF1F4"/>
    <!-- the duck slot -->
    <g transform="translate(150,118)">
      <rect width="72" height="64" rx="9" fill="#BBD9EA"/>
      <ellipse cx="36" cy="52" rx="22" ry="16" fill="#F7D154"/>
      <circle cx="36" cy="30" r="18" fill="#F9D85E"/>
      <circle cx="29" cy="28" r="3.4" fill="#2A1C12"/>
      <circle cx="43" cy="28" r="3.4" fill="#2A1C12"/>
      <ellipse cx="36" cy="37" rx="9" ry="5" fill="#F2A03D"/>
    </g>
    <text x="140" y="220" text-anchor="middle" fill="#2C6488" font-size="13" font-weight="700">ads out. aww in.</text>
  </g>
</svg>
